<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field-Text-Input-Flydown</title>
  <script src="https://unpkg.com/blockly@13/blockly.min.js"></script>
  <script src="./index.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    #blocklyDiv {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="blocklyDiv"></div>

  <script>
const varFlydownXml = `
  <xml>
    <block type="flydown_get">
      <field name="VAR">{{text}}</field>
    </block>
    <block type="flydown_set">
      <field name="VAR">{{text}}</field>
      <value name="VALUE">
        <shadow type="math_number">
          <field name="NUM">0</field>
        </shadow>
      </value>
    </block>
    <block type="flydown_change">
      <field name="VAR">{{text}}</field>
      <value name="DELTA">
        <shadow type="math_number">
          <field name="NUM">1</field>
        </shadow>
      </value>
    </block>
  </xml>
`;

const getSetFlydownXml = `
  <xml>
    <block type="variables_get">
      <field name="VAR">{{text}}</field>
    </block>
    <block type="variables_set">
      <field name="VAR">{{text}}</field>
    </block>
  </xml>
`;

Blockly.common.defineBlocks({
  custom_text_input: {
    init: function() {
      this.appendDummyInput('input')
        .appendField('FieldTextInputWithFlydown')
        .appendField(new FieldTextInputWithFlydown('item', getSetFlydownXml), 'TEXT');
      this.appendStatementInput('statement')
        .appendField('do');
      this.setPreviousStatement(true);
      this.setNextStatement(true);
      this.setTooltip('Statement wrapper with a flydown field.');
      this.setColour(250);
    }
  },
  flydown_get: {
    init: function() {
      this.appendDummyInput()
        .appendField('get')
        .appendField(new FieldTextInputWithFlydown('item', varFlydownXml), 'VAR');
      this.setOutput(true, null);
      this.setTooltip('Reporter whose name opens a flydown.');
      this.setColour(330);
    }
  },
  flydown_set: {
    init: function() {
      this.appendValueInput('VALUE')
        .setCheck(null)
        .appendField('set')
        .appendField(new FieldTextInputWithFlydown('item', varFlydownXml), 'VAR')
        .appendField('to');
      this.setPreviousStatement(true);
      this.setNextStatement(true);
      this.setTooltip('Set a named value. Hover the name for related blocks.');
      this.setColour(330);
    }
  },
  flydown_change: {
    init: function() {
      this.appendValueInput('DELTA')
        .setCheck('Number')
        .appendField('change')
        .appendField(new FieldTextInputWithFlydown('counter', varFlydownXml), 'VAR')
        .appendField('by');
      this.setPreviousStatement(true);
      this.setNextStatement(true);
      this.setTooltip('Change a named number. Hover the name for related blocks.');
      this.setColour(330);
    }
  },
  flydown_print: {
    init: function() {
      this.appendDummyInput()
        .appendField('print')
        .appendField(new FieldTextInputWithFlydown('item', varFlydownXml), 'VAR');
      this.setPreviousStatement(true);
      this.setNextStatement(true);
      this.setTooltip('Print a named value. Hover the name for related blocks.');
      this.setColour(160);
    }
  },
  flydown_for: {
    init: function() {
      this.appendDummyInput()
        .appendField('for')
        .appendField(new FieldTextInputWithFlydown('i', varFlydownXml), 'VAR')
        .appendField('from')
        .appendField(new Blockly.FieldNumber(1), 'FROM')
        .appendField('to')
        .appendField(new Blockly.FieldNumber(10), 'TO');
      this.appendStatementInput('DO')
        .appendField('do');
      this.setPreviousStatement(true);
      this.setNextStatement(true);
      this.setTooltip('Count loop whose index field has a flydown.');
      this.setColour(120);
    }
  }
});

const js = javascript.javascriptGenerator;
js.forBlock['custom_text_input'] = function(block, generator) {
  const name = block.getFieldValue('TEXT');
  const body = generator.statementToCode(block, 'statement');
  return `${name}() {\n${body}}\n`;
};
js.forBlock['flydown_get'] = function(block, generator) {
  return [generator.getVariableName(block.getFieldValue('VAR')), js.ORDER_ATOMIC];
};
js.forBlock['flydown_set'] = function(block, generator) {
  const name = generator.getVariableName(block.getFieldValue('VAR'));
  const value = generator.valueToCode(block, 'VALUE', js.ORDER_ASSIGNMENT) || '0';
  return `${name} = ${value};\n`;
};
js.forBlock['flydown_change'] = function(block, generator) {
  const name = generator.getVariableName(block.getFieldValue('VAR'));
  const delta = generator.valueToCode(block, 'DELTA', js.ORDER_ADDITION) || '0';
  return `${name} = (${name} || 0) + ${delta};\n`;
};
js.forBlock['flydown_print'] = function(block, generator) {
  const name = generator.getVariableName(block.getFieldValue('VAR'));
  return `console.log(${name});\n`;
};
js.forBlock['flydown_for'] = function(block, generator) {
  const name = generator.getVariableName(block.getFieldValue('VAR'));
  const from = Number(block.getFieldValue('FROM'));
  const to = Number(block.getFieldValue('TO'));
  const body = generator.statementToCode(block, 'DO');
  return `for (let ${name} = ${from}; ${name} <= ${to}; ${name}++) {\n${body}}\n`;
};


    // Create toolbox
    const toolbox = `
      <xml>
        <category name="My Custom Block" colour="#9C27B0">
          <block type="custom_text_input"></block>
          <block type="flydown_get"></block>
          <block type="flydown_set">
            <value name="VALUE">
              <shadow type="math_number">
                <field name="NUM">0</field>
              </shadow>
            </value>
          </block>
          <block type="flydown_change">
            <value name="DELTA">
              <shadow type="math_number">
                <field name="NUM">1</field>
              </shadow>
            </value>
          </block>
          <block type="flydown_print"></block>
          <block type="flydown_for"></block>
        </category>
        <category name="Logic" colour="#5C81A6">
          <block type="controls_if"></block>
          <block type="logic_compare"></block>
          <block type="logic_operation"></block>
          <block type="logic_negate"></block>
          <block type="logic_boolean"></block>
          <block type="logic_ternary"></block>
        </category>
        <category name="Loops" colour="#5CA65C">
          <block type="controls_repeat_ext">
            <value name="TIMES">
              <shadow type="math_number">
                <field name="NUM">10</field>
              </shadow>
            </value>
          </block>
          <block type="controls_whileUntil"></block>
          <block type="controls_for">
            <field name="VAR">i</field>
            <value name="FROM">
              <shadow type="math_number">
                <field name="NUM">1</field>
              </shadow>
            </value>
            <value name="TO">
              <shadow type="math_number">
                <field name="NUM">10</field>
              </shadow>
            </value>
            <value name="BY">
              <shadow type="math_number">
                <field name="NUM">1</field>
              </shadow>
            </value>
          </block>
          <block type="controls_forEach"></block>
          <block type="controls_flow_statements"></block>
        </category>
        <category name="Math" colour="#5C68A6">
          <block type="math_number">
            <field name="NUM">0</field>
          </block>
          <block type="math_arithmetic">
            <value name="A">
              <shadow type="math_number">
                <field name="NUM">1</field>
              </shadow>
            </value>
            <value name="B">
              <shadow type="math_number">
                <field name="NUM">1</field>
              </shadow>
            </value>
          </block>
          <block type="math_single">
            <value name="NUM">
              <shadow type="math_number">
                <field name="NUM">9</field>
              </shadow>
            </value>
          </block>
          <block type="math_number_property">
            <value name="NUMBER_TO_CHECK">
              <shadow type="math_number">
                <field name="NUM">0</field>
              </shadow>
            </value>
          </block>
          <block type="math_round">
            <value name="NUM">
              <shadow type="math_number">
                <field name="NUM">3.1</field>
              </shadow>
            </value>
          </block>
          <block type="math_modulo">
            <value name="DIVIDEND">
              <shadow type="math_number">
                <field name="NUM">64</field>
              </shadow>
            </value>
            <value name="DIVISOR">
              <shadow type="math_number">
                <field name="NUM">10</field>
              </shadow>
            </value>
          </block>
          <block type="math_random_int">
            <value name="FROM">
              <shadow type="math_number">
                <field name="NUM">1</field>
              </shadow>
            </value>
            <value name="TO">
              <shadow type="math_number">
                <field name="NUM">100</field>
              </shadow>
            </value>
          </block>
        </category>
        <category name="Text" colour="#5CA68D">
          <block type="text">
            <field name="TEXT"></field>
          </block>
          <block type="text_join"></block>
          <block type="text_append">
            <value name="TEXT">
              <shadow type="text">
                <field name="TEXT"></field>
              </shadow>
            </value>
          </block>
          <block type="text_length">
            <value name="VALUE">
              <shadow type="text">
                <field name="TEXT">abc</field>
              </shadow>
            </value>
          </block>
          <block type="text_isEmpty">
            <value name="VALUE">
              <shadow type="text">
                <field name="TEXT"></field>
              </shadow>
            </value>
          </block>
          <block type="text_print">
            <value name="TEXT">
              <shadow type="text">
                <field name="TEXT">abc</field>
              </shadow>
            </value>
          </block>
        </category>
        <category name="Lists" colour="#745CA6">
          <block type="lists_create_with">
            <mutation items="0"></mutation>
          </block>
          <block type="lists_create_with"></block>
          <block type="lists_repeat">
            <value name="NUM">
              <shadow type="math_number">
                <field name="NUM">5</field>
              </shadow>
            </value>
          </block>
          <block type="lists_length"></block>
          <block type="lists_isEmpty"></block>
          <block type="lists_indexOf">
            <value name="VALUE">
              <block type="variables_get">
                <field name="VAR">list</field>
              </block>
            </value>
          </block>
          <block type="lists_getIndex">
            <value name="VALUE">
              <block type="variables_get">
                <field name="VAR">list</field>
              </block>
            </value>
          </block>
        </category>
        <category name="Variables" colour="#A65C81" custom="VARIABLE"></category>
        <category name="Functions" colour="#9A5CA6" custom="PROCEDURE"></category>
      </xml>
    `;

    // Initialize workspace
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: toolbox,
      scrollbars: true,
      trashcan: true,
    });
    FieldFlydown.init(workspace);
    const block = workspace.newBlock('custom_text_input');
    block.initSvg();
    block.render();
    block.setMovable(false);
    block.setDeletable(false);
    block.moveBy(15 - block.getRelativeToSurfaceXY().x, 15 - block.getRelativeToSurfaceXY().y);
  </script>
</body>
</html>
